# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "assembly"
description: "De novo assembly with SKESA for Illumina and Flye plus Medaka for Nanopore"
keywords:
  - bacteria
  - transmission
  - genomics
components:
  - skesa
  - flye
  - medaka
  - gunzip
input:
  - ch_reads:
      type: channel
      description: "Reads per sample: [ val(meta), [ fastq ] ]"
output:
  - assembly:
      type: channel
      description: "Uncompressed assembly named <id>.fa: [ val(meta), path(fasta) ]"
authors:
  - "@ryanjameskennedy"
