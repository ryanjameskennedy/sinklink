# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "variant_calling"
description: "Variant calling against the reference genome (Snippy for Illumina, minimap2 and Clair3 for Nanopore) and SNP distances from masked, recombination-filtered pseudogenomes"
keywords:
  - bacteria
  - variant calling
  - snp
components:
  - snippy/run
  - minimap2/align
  - clair3
  - nucmer
  - phispy
  - gawk
  - mosdepth
  - bcftools/view
  - bcftools/consensus
  - gubbins
  - snpdists
input:
  - ch_reads:
      type: channel
      description: "Reads per sample: [ val(meta), [ fastq ] ]"
  - ch_reference:
      type: channel
      description: "Reference genome per sample: [ val(meta), [ fasta, fai, gff, gbff ] ]"
  - clair3_model:
      type: string
      description: "Name of a Clair3 model bundled in its container"
output:
  - vcf:
      type: channel
      description: "Variant calls: [ val(meta), path(vcf.gz) ]"
  - pseudogenome:
      type: channel
      description: "Chromosome with PASS substitutions applied and low-depth, repeat and prophage regions masked: [ val(meta), path(fasta) ]"
  - snp_dists:
      type: channel
      description: "Pairwise SNP distances per schema: [ val(meta), path(tsv) ]"
authors:
  - "@ryanjameskennedy"
