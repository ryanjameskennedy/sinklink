# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "read_preparation"
description: "Optional read filtering and read QC per platform"
keywords:
  - bacteria
  - transmission
  - genomics
components:
  - trimmomatic
  - filtlong
  - fastqc
  - nanoplot
input:
  - ch_reads:
      type: channel
      description: "Reads per sample: [ val(meta), [ fastq ] ], with meta.platform set to illumina or nanopore"
output:
  - reads:
      type: channel
      description: "Filtered (or original) reads: [ val(meta), [ fastq ] ]"
  - multiqc_files:
      type: channel
      description: "FastQC zips, Trimmomatic logs and NanoPlot stats for MultiQC"
  - versions:
      type: channel
      description: "FastQC versions.yml"
authors:
  - "@ryanjameskennedy"
