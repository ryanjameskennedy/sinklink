name: "make_pseudogenome"
description: Apply an isolate's reference-based substitutions to the reference genome and mask positions with low read depth
keywords:
  - variant calling
  - snp
  - pseudogenome
tools:
  - "make_pseudogenome.py":
      description: "sinklink script in bin/"
input:
  - - meta:
        type: map
        description: Groovy map with id and platform
    - reference:
        type: file
        description: Reference genome FASTA
    - vcf:
        type: file
        description: Haploid VCF from Snippy or Clair3
    - depth:
        type: file
        description: samtools depth output for the BAM the variants were called from
output:
  fasta:
    - - meta:
          type: map
          description: Groovy map with sample information
      - "*.pseudogenome.fa":
          type: file
          description: Reference-length sequence with the isolate's substitutions, N for low depth and - for no reads
  tsv:
    - - meta:
          type: map
          description: Groovy map with sample information
      - "*.pseudogenome.tsv":
          type: file
          description: Reference length, substitutions applied, masked positions and fraction called
authors:
  - "@ryanjameskennedy"
