name: Docs
# Build the Sphinx documentation the way Read the Docs does, failing on warnings.
on:
  push:
    branches:
      - master
      - dev
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requirements
        run: pip install -r docs/requirements.txt

      - name: Build HTML
        run: sphinx-build -W --keep-going -b html docs docs/_build/html
