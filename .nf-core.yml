repository_type: pipeline

nf_core_version: 3.5.2

lint:
  files_unchanged:
    - LICENSE
    - .github/ISSUE_TEMPLATE/feature_request.yml
    - .github/workflows/branch.yml
    - .github/CONTRIBUTING.md
    - CODE_OF_CONDUCT.md
    - assets/nf-core-sinklink_logo_light.png
    - docs/images/nf-core-sinklink_logo_light.png
    - docs/images/nf-core-sinklink_logo_dark.png
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/PULL_REQUEST_TEMPLATE.md
    - assets/email_template.txt
    - docs/README.md
    - .gitignore
  nextflow_config:
    - manifest.name
    - manifest.homePage
  multiqc_config:
    - report_comment
  files_exist:
    - conf/igenomes.config
    - conf/igenomes_ignored.config
    - CODE_OF_CONDUCT.md
    - assets/nf-core-sinklink_logo_light.png
    - docs/images/nf-core-sinklink_logo_light.png
    - docs/images/nf-core-sinklink_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml
  readme:
    - nextflow_badge
    - nfcore_template_badge
  included_configs: false

template:
  org: ryanjameskennedy
  name: sinklink
  description: Sink-to-patient transmission checks with read QC, assembly, assembly QC and cgMLST/wgMLST allele distances
  author: Ryan Kennedy
  version: 0.3.0
  force: true
  outdir: .
  skip_features:
    - igenomes
    - gpu
    - codespaces
    - seqera_platform
    - vscode
    - github_badges
  is_nfcore: false
